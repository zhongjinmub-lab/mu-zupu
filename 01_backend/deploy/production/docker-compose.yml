services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mu-agent-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mu_agent_saas
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - mu_agent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d mu_agent_saas"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: mu-agent-saas-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mu_agent_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: mu-agent-saas-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - mu_agent_minio_data:/data

volumes:
  mu_agent_pg_data:
  mu_agent_redis_data:
  mu_agent_minio_data:
